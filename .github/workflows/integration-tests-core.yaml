name: Run integration tests for Core
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      token:
        description: 'GitHub token if called from another workflow'
        required: false
        type: string

permissions: {}

jobs:
  core-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run Core integration tests
        uses: ./.github/actions/run-core-integration-tests

      # The report is generated in the allure-report job, which runs on a
      # different runner, so hand the results over as an artifact.
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results-core
          path: allure-results
          if-no-files-found: ignore
          retention-days: 1

  allure-report:
    needs: core-tests
    runs-on: ubuntu-latest
    if: always() && github.repository == 'firebolt-db/firebolt-node-sdk'
    permissions:
      contents: write # publishes the report to gh-pages
      statuses: write # sets the report commit status
      pages: read # reads the GitHub Pages URL for the report link
    steps:
      # Only run Allure reporting on the main repository, not forks.
      # action-allure-report v2 checks out the pages branch for the history itself.
      - name: Download Allure results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: allure-results-core
          path: allure-results

      - name: Allure Report
        uses: firebolt-db/action-allure-report@8cdc116f65f6eca845a992e347e72b75ca8ccf5f # v2.1.1
        with:
          github-token: ${{ inputs.token || secrets.GITHUB_TOKEN }}
          pages-branch: gh-pages
          mapping-json: |
            {
              "allure-results": "integration-core"
            }
