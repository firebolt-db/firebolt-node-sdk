name: Run integration tests for Core
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      token:
        description: 'GitHub token if called from another workflow'
        required: false
        type: string

permissions: {}

jobs:
  core-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run Core integration tests
        uses: ./.github/actions/run-core-integration-tests

  allure-report:
    needs: core-tests
    runs-on: ubuntu-latest
    if: always() && github.repository == 'firebolt-db/firebolt-node-sdk'
    permissions:
      contents: write # publishes the report to gh-pages
      statuses: write # sets the report commit status
    steps:
      # Need to pull the pages branch in order to fetch the previous runs
      # Only run Allure reporting on the main repository, not forks
      - name: Get Allure history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
            ref: gh-pages
            path: gh-pages
            persist-credentials: false

      - name: Allure Report
        uses: firebolt-db/action-allure-report@8cdc116f65f6eca845a992e347e72b75ca8ccf5f # v2.1.1
        with:
            github-key: ${{ inputs.token || secrets.GITHUB_TOKEN }}
            test-type: integration-core
            allure-dir: allure-results
            pages-branch: gh-pages
            repository-name: firebolt-node-sdk

