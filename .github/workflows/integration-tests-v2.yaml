name: Run integration tests for 2.0
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      FIREBOLT_CLIENT_ID_STG_NEW_IDN:
        required: true
      FIREBOLT_CLIENT_SECRET_STG_NEW_IDN:
        required: true
    inputs:
      engine-version:
        description: 'Engine version to use for integration tests'
        required: false
        type: string
        default: ''
      token:
        description: 'GitHub token if called from another workflow'
        required: false
        type: string

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allure Report publishes to gh-pages
      statuses: write # Allure Report sets the report commit status
      pages: read # Allure Report reads the GitHub Pages URL
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'firebolt-db/firebolt-node-sdk'
          persist-credentials: false

      - name: Set up node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup database and engine
        id: setup
        uses: firebolt-db/integration-testing-setup@1feb289e8da573c5f1f74d8ff3cd69bcb5b5891a # v1.0.4
        with:
          firebolt-client-id: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
          firebolt-client-secret: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}
          account: ${{ vars.FIREBOLT_ACCOUNT }}
          api-endpoint: "api.staging.firebolt.io"
          engine-version: ${{ inputs.engine-version }}

      - name: Run integration tests
        env:
          FIREBOLT_ACCOUNT: ${{ vars.FIREBOLT_ACCOUNT }}
          FIREBOLT_DATABASE: ${{ steps.setup.outputs.database_name }}
          FIREBOLT_ENGINE_NAME: ${{ steps.setup.outputs.engine_name }}
          FIREBOLT_API_ENDPOINT: "api.staging.firebolt.io"
          FIREBOLT_CLIENT_ID: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
          FIREBOLT_CLIENT_SECRET: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}
        run: |
          npm run test:ci integration/v2

      # Only run Allure reporting on the main repository, not forks.
      # action-allure-report v2 checks out the pages branch for the history itself.
      - name: Allure Report
        uses: firebolt-db/action-allure-report@8cdc116f65f6eca845a992e347e72b75ca8ccf5f # v2.1.1
        if: always() && github.repository == 'firebolt-db/firebolt-node-sdk'
        with:
          github-token: ${{ inputs.token || secrets.GITHUB_TOKEN }}
          pages-branch: gh-pages
          mapping-json: |
            {
              "allure-results": "integration"
            }
