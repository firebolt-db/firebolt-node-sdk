name: 'Setup Firebolt Core'
description: 'Start Firebolt Core in Docker and wait for it to be ready'
inputs:
  database:
    description: 'Database name for Firebolt Core'
    required: false
    default: 'firebolt'
  endpoint:
    description: 'Firebolt Core endpoint'
    required: false
    default: 'http://127.0.0.1:3473'
outputs:
  database:
    description: 'Database name'
    value: ${{ inputs.database }}
  endpoint:
    description: 'Firebolt Core endpoint'
    value: ${{ inputs.endpoint }}
  host:
    description: 'Firebolt host for discovery-based connections'
    value: ${{ steps.setup-outputs.outputs.host }}
runs:
  using: 'composite'
  steps:
    - name: Install Firebolt
      shell: bash
      run: |
        bash <(curl -s https://get.firebolt.io/) <<< "n"

    - name: Create firebolt-data directory
      shell: bash
      run: |
        mkdir -p -m 777 ./firebolt-data
        sudo chmod 777 ./firebolt-data

    - name: Start Firebolt
      shell: bash
      run: |
        ENGINE_REPO="${ENGINE_REPO:-ghcr.io/firebolt-db/engine}"
        ENGINE_TAG="${ENGINE_TAG:-dev}"
        FIREBOLT_USER="${FIREBOLT_USER:-firebolt}"
        docker run -d --rm --name firebolt \
          --user "$FIREBOLT_USER" \
          --ulimit memlock=8589934592:8589934592 \
          --security-opt seccomp=unconfined \
          -p 127.0.0.1:3473:3473 \
          -v "$(pwd)/firebolt-data:/var/lib/firebolt" \
          "$ENGINE_REPO:$ENGINE_TAG"

    - name: Wait for Firebolt to be ready
      shell: bash
      run: |
        echo "Waiting for Firebolt to be ready..."
        timeout=30
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          # Try to connect and execute a simple query
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ inputs.endpoint }}/" \
            --data-binary "SELECT 1" 2>&1) || response=""
          http_code=$(echo "$response" | tail -n1)
          
          if [ "$http_code" = "200" ]; then
            echo "Firebolt Core is ready!"
            break
          fi
          echo "Waiting... ($elapsed/$timeout seconds) - HTTP $http_code"
          sleep 3
          elapsed=$((elapsed + 3))
        done
        
        if [ $elapsed -ge $timeout ]; then
          echo "Firebolt failed to start within $timeout seconds"
          echo "Container logs:"
          docker logs firebolt || true
          echo "Container status:"
          docker ps -a | grep firebolt || true
          exit 1
        fi
        
        # Give Firebolt a bit more time to fully initialize
        echo "Firebolt is responding, waiting additional 5 seconds for full initialization..."
        sleep 5

    - name: Create database if it doesn't exist
      shell: bash
      run: |
        echo "Creating database '${{ inputs.database }}' ..."
        # Create the database using a SQL command
        response=$(curl -s -w "\n%{http_code}" -X POST "${{ inputs.endpoint }}/?database=default" \
          --data-binary "CREATE DATABASE IF NOT EXISTS \"${{ inputs.database }}\"" 2>&1)
        http_code=$(echo "$response" | tail -n1)
        
        if [ "$http_code" = "200" ]; then
          echo "Database '${{ inputs.database }}' created or already exists"
        else
          echo "Warning: Database creation returned HTTP $http_code"
          echo "Response: $response"
          exit 1
        fi

    - name: Set outputs
      id: setup-outputs
      shell: bash
      run: |
        endpoint="${{ inputs.endpoint }}"
        host="${endpoint#http://}"
        host="${host#https://}"
        host="${host%%/*}"
        echo "database=${{ inputs.database }}" >> $GITHUB_OUTPUT
        echo "endpoint=${{ inputs.endpoint }}" >> $GITHUB_OUTPUT
        echo "host=$host" >> $GITHUB_OUTPUT

